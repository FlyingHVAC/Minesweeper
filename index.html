<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A self-contained, offline Minesweeper game inspired by the classic Windows version.">
  <title>Classic Minesweeper</title>
  <style>
    :root {
      --panel: #c0c0c0;
      --light: #ffffff;
      --mid: #808080;
      --dark: #000000;
      --cell-size: 28px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #008080;
      color: #000;
      font-family: "Courier New", Courier, monospace;
      -webkit-user-select: none;
      user-select: none;
    }

    .window {
      max-width: 100%;
      padding: 3px;
      background: var(--panel);
      border-top: 3px solid var(--light);
      border-left: 3px solid var(--light);
      border-right: 3px solid var(--dark);
      border-bottom: 3px solid var(--dark);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-bottom: 5px;
      padding: 3px 4px 3px 7px;
      background: #000080;
      color: #fff;
      font-family: Arial, sans-serif;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .title-icon { margin-right: 5px; }

    .window-button {
      width: 22px;
      height: 20px;
      padding: 0;
      background: var(--panel);
      border-top: 2px solid var(--light);
      border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark);
      border-bottom: 2px solid var(--dark);
      font: bold 15px/15px Arial, sans-serif;
      cursor: pointer;
    }

    .menu-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 28px;
      padding: 2px 4px 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .menu-bar label { margin-left: 4px; }

    select, .new-game {
      min-height: 25px;
      background: var(--panel);
      border-top: 2px solid var(--light);
      border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark);
      border-bottom: 2px solid var(--dark);
      font: 13px Arial, sans-serif;
    }

    .new-game { padding: 2px 8px; cursor: pointer; }

    .new-game:active, .window-button:active, .face:active {
      border-top-color: var(--dark);
      border-left-color: var(--dark);
      border-right-color: var(--light);
      border-bottom-color: var(--light);
    }

    .game-body { padding: 6px; }

    .status-panel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      height: 66px;
      margin-bottom: 8px;
      padding: 7px;
      border-top: 3px solid var(--mid);
      border-left: 3px solid var(--mid);
      border-right: 3px solid var(--light);
      border-bottom: 3px solid var(--light);
    }

    .counter {
      width: 74px;
      padding: 4px 5px;
      background: #000;
      color: #ff0000;
      border-top: 2px solid var(--mid);
      border-left: 2px solid var(--mid);
      border-right: 2px solid var(--light);
      border-bottom: 2px solid var(--light);
      font: bold 30px/34px "Courier New", monospace;
      text-align: right;
      letter-spacing: 1px;
      text-shadow: 0 0 4px #f00;
    }

    #timer { justify-self: end; }

    .face {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--panel);
      border-top: 3px solid var(--light);
      border-left: 3px solid var(--light);
      border-right: 3px solid var(--dark);
      border-bottom: 3px solid var(--dark);
      font-size: 25px;
      cursor: pointer;
    }

    .board-wrap {
      overflow: auto;
      max-width: calc(100vw - 42px);
      max-height: calc(100vh - 220px);
      border-top: 3px solid var(--mid);
      border-left: 3px solid var(--mid);
      border-right: 3px solid var(--light);
      border-bottom: 3px solid var(--light);
      background: var(--mid);
      touch-action: manipulation;
    }

    .board {
      display: grid;
      width: max-content;
      background: var(--mid);
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--panel);
      border-top: 3px solid var(--light);
      border-left: 3px solid var(--light);
      border-right: 3px solid var(--mid);
      border-bottom: 3px solid var(--mid);
      color: #000;
      font: bold 18px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .cell:focus-visible, button:focus-visible, select:focus-visible {
      outline: 2px dashed #000;
      outline-offset: -4px;
    }

    .cell.revealed {
      border: 1px solid var(--mid);
      cursor: default;
    }

    .cell.flagged { color: #d20000; }
    .cell.mine { background: #c0c0c0; }
    .cell.exploded { background: #ff0000; }
    .cell.wrong { color: #d20000; }
    .n1 { color: #0000ff; }
    .n2 { color: #008000; }
    .n3 { color: #ff0000; }
    .n4 { color: #000080; }
    .n5 { color: #800000; }
    .n6 { color: #008080; }
    .n7 { color: #000000; }
    .n8 { color: #808080; }

    .instructions {
      margin: 7px 2px 1px;
      font: 12px/1.35 Arial, sans-serif;
      color: #222;
      text-align: center;
    }

    @media (max-width: 560px) {
      :root { --cell-size: 30px; }
      body { place-items: start center; padding: 8px; }
      .window { max-width: calc(100vw - 16px); }
      .board-wrap { max-width: calc(100vw - 42px); max-height: calc(100vh - 230px); }
      .instructions { max-width: 390px; }
    }
  </style>
</head>
<body>
  <main class="window" aria-label="Classic Minesweeper game">
    <div class="title-bar">
      <span><span class="title-icon" aria-hidden="true">💣</span>Minesweeper</span>
      <button class="window-button" id="titleReset" type="button" aria-label="Restart game">×</button>
    </div>

    <div class="menu-bar">
      <label for="difficulty"><u>G</u>ame:</label>
      <select id="difficulty" aria-label="Select difficulty">
        <option value="beginner">Beginner: 9 × 9, 10 mines</option>
        <option value="intermediate">Intermediate: 16 × 16, 40 mines</option>
        <option value="expert">Expert: 30 × 16, 99 mines</option>
      </select>
      <button class="new-game" id="newGame" type="button">New Game</button>
    </div>

    <section class="game-body">
      <div class="status-panel">
        <div class="counter" id="mineCounter" aria-label="Mines remaining">010</div>
        <button class="face" id="face" type="button" aria-label="Start a new game">🙂</button>
        <div class="counter" id="timer" aria-label="Elapsed time">000</div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Minesweeper board"></div>
      </div>

      <p class="instructions">
        Left-click/tap to reveal. Right-click to flag. Double-click a revealed number to clear
        its unflagged neighbors when the adjacent flag count matches. On touchscreens, press and hold to flag.
      </p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const LEVELS = {
        beginner: { rows: 9, cols: 9, mines: 10 },
        intermediate: { rows: 16, cols: 16, mines: 40 },
        expert: { rows: 16, cols: 30, mines: 99 }
      };

      const boardEl = document.getElementById("board");
      const mineCounterEl = document.getElementById("mineCounter");
      const timerEl = document.getElementById("timer");
      const faceEl = document.getElementById("face");
      const difficultyEl = document.getElementById("difficulty");
      const newGameEl = document.getElementById("newGame");
      const titleResetEl = document.getElementById("titleReset");

      let config;
      let cells = [];
      let started = false;
      let ended = false;
      let flags = 0;
      let revealedCount = 0;
      let seconds = 0;
      let timerId = null;
      let pressTimer = null;
      let longPressTriggered = false;

      function beginGame() {
        clearInterval(timerId);
        timerId = null;
        config = LEVELS[difficultyEl.value];
        cells = [];
        started = false;
        ended = false;
        flags = 0;
        revealedCount = 0;
        seconds = 0;
        faceEl.textContent = "🙂";
        timerEl.textContent = "000";
        boardEl.innerHTML = "";
        boardEl.style.gridTemplateColumns = `repeat(${config.cols}, var(--cell-size))`;
        boardEl.setAttribute("aria-rowcount", config.rows);
        boardEl.setAttribute("aria-colcount", config.cols);

        for (let row = 0; row < config.rows; row++) {
          cells[row] = [];
          for (let col = 0; col < config.cols; col++) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "cell";
            button.setAttribute("role", "gridcell");
            button.setAttribute("aria-label", `Covered square, row ${row + 1}, column ${col + 1}`);
            button.dataset.row = row;
            button.dataset.col = col;
            boardEl.appendChild(button);
            cells[row][col] = {
              row, col, mine: false, adjacent: 0,
              revealed: false, flagged: false, element: button
            };
          }
        }
        updateMineCounter();
      }

      function startTimer() {
        timerId = setInterval(() => {
          seconds = Math.min(999, seconds + 1);
          timerEl.textContent = String(seconds).padStart(3, "0");
          if (seconds === 999) clearInterval(timerId);
        }, 1000);
      }

      function placeMines(safeRow, safeCol) {
        const excluded = new Set();
        forEachNeighbor(safeRow, safeCol, (r, c) => excluded.add(`${r},${c}`), true);

        const available = [];
        for (const row of cells) {
          for (const cell of row) {
            if (!excluded.has(`${cell.row},${cell.col}`)) available.push(cell);
          }
        }

        shuffle(available);
        available.slice(0, config.mines).forEach(cell => { cell.mine = true; });

        for (const row of cells) {
          for (const cell of row) {
            if (!cell.mine) {
              let count = 0;
              forEachNeighbor(cell.row, cell.col, (r, c) => {
                if (cells[r][c].mine) count++;
              });
              cell.adjacent = count;
            }
          }
        }
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function forEachNeighbor(row, col, callback, includeCenter = false) {
        for (let r = Math.max(0, row - 1); r <= Math.min(config.rows - 1, row + 1); r++) {
          for (let c = Math.max(0, col - 1); c <= Math.min(config.cols - 1, col + 1); c++) {
            if (includeCenter || r !== row || c !== col) callback(r, c);
          }
        }
      }

      function reveal(cell) {
        if (ended || cell.revealed || cell.flagged) return;

        if (!started) {
          started = true;
          placeMines(cell.row, cell.col);
          startTimer();
        }

        if (cell.mine) {
          cell.revealed = true;
          cell.element.classList.add("revealed", "mine", "exploded");
          cell.element.textContent = "💣";
          loseGame();
          return;
        }

        const queue = [cell];
        while (queue.length) {
          const current = queue.shift();
          if (current.revealed || current.flagged) continue;

          current.revealed = true;
          revealedCount++;
          current.element.classList.add("revealed");
          current.element.setAttribute("aria-label", current.adjacent
            ? `${current.adjacent} adjacent mines`
            : "Empty revealed square");

          if (current.adjacent > 0) {
            current.element.textContent = current.adjacent;
            current.element.classList.add(`n${current.adjacent}`);
          } else {
            forEachNeighbor(current.row, current.col, (r, c) => {
              const neighbor = cells[r][c];
              if (!neighbor.revealed && !neighbor.flagged && !neighbor.mine) queue.push(neighbor);
            });
          }
        }

        if (revealedCount === config.rows * config.cols - config.mines) winGame();
      }

      function chordReveal(cell) {
        if (ended || !cell.revealed || cell.adjacent === 0) return;

        const neighbors = [];
        let flaggedNeighbors = 0;

        forEachNeighbor(cell.row, cell.col, (r, c) => {
          const neighbor = cells[r][c];
          neighbors.push(neighbor);
          if (neighbor.flagged) flaggedNeighbors++;
        });

        if (flaggedNeighbors !== cell.adjacent) return;

        // Matching the number is enough to open every unflagged neighbor.
        // If a flag is misplaced, an unflagged mine may be opened and the game is lost.
        for (const neighbor of neighbors) {
          if (ended) break;
          if (!neighbor.flagged && !neighbor.revealed) reveal(neighbor);
        }
      }

      function toggleFlag(cell) {
        if (ended || cell.revealed) return;
        if (!cell.flagged && flags >= config.mines) return;

        cell.flagged = !cell.flagged;
        flags += cell.flagged ? 1 : -1;
        cell.element.classList.toggle("flagged", cell.flagged);
        cell.element.textContent = cell.flagged ? "🚩" : "";
        cell.element.setAttribute("aria-label", cell.flagged
          ? `Flagged square, row ${cell.row + 1}, column ${cell.col + 1}`
          : `Covered square, row ${cell.row + 1}, column ${cell.col + 1}`);
        updateMineCounter();
      }

      function updateMineCounter() {
        const remaining = Math.max(-99, config.mines - flags);
        mineCounterEl.textContent = remaining < 0
          ? `-${String(Math.abs(remaining)).padStart(2, "0")}`
          : String(remaining).padStart(3, "0");
      }

      function winGame() {
        ended = true;
        clearInterval(timerId);
        faceEl.textContent = "😎";
        for (const row of cells) {
          for (const cell of row) {
            if (cell.mine && !cell.flagged) {
              cell.flagged = true;
              cell.element.textContent = "🚩";
              cell.element.classList.add("flagged");
            }
          }
        }
        flags = config.mines;
        updateMineCounter();
      }

      function loseGame() {
        ended = true;
        clearInterval(timerId);
        faceEl.textContent = "😵";
        for (const row of cells) {
          for (const cell of row) {
            if (cell.mine && !cell.revealed && !cell.flagged) {
              cell.element.classList.add("revealed", "mine");
              cell.element.textContent = "💣";
            } else if (!cell.mine && cell.flagged) {
              cell.element.classList.add("revealed", "wrong");
              cell.element.textContent = "❌";
            }
          }
        }
      }

      function getCellFromEvent(event) {
        const target = event.target.closest(".cell");
        if (!target || !boardEl.contains(target)) return null;
        return cells[Number(target.dataset.row)][Number(target.dataset.col)];
      }

      boardEl.addEventListener("click", event => {
        const cell = getCellFromEvent(event);
        if (!cell || longPressTriggered) {
          longPressTriggered = false;
          return;
        }
        reveal(cell);
      });

      boardEl.addEventListener("dblclick", event => {
        const cell = getCellFromEvent(event);
        if (!cell) return;
        event.preventDefault();
        chordReveal(cell);
      });

      boardEl.addEventListener("contextmenu", event => {
        const cell = getCellFromEvent(event);
        if (!cell) return;
        event.preventDefault();
        toggleFlag(cell);
      });

      boardEl.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse") return;
        const cell = getCellFromEvent(event);
        if (!cell) return;
        longPressTriggered = false;
        pressTimer = setTimeout(() => {
          longPressTriggered = true;
          toggleFlag(cell);
          if (navigator.vibrate) navigator.vibrate(30);
        }, 500);
      });

      ["pointerup", "pointercancel", "pointerleave", "pointermove"].forEach(type => {
        boardEl.addEventListener(type, () => {
          clearTimeout(pressTimer);
          pressTimer = null;
        });
      });

      boardEl.addEventListener("pointerdown", event => {
        if (event.button === 0 && getCellFromEvent(event) && !ended) faceEl.textContent = "😮";
      });
      window.addEventListener("pointerup", () => {
        if (!ended) faceEl.textContent = "🙂";
      });

      difficultyEl.addEventListener("change", beginGame);
      newGameEl.addEventListener("click", beginGame);
      faceEl.addEventListener("click", beginGame);
      titleResetEl.addEventListener("click", beginGame);

      beginGame();
    })();
  </script>
</body>
</html>
